[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "overlay_render"
version = "0.1.0"
description = "View-only visualization pipeline for neuroscience imaging data"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "RamanLab"}
]
keywords = ["neuroscience", "imaging", "visualization", "calcium-imaging", "overlay"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Image Processing",
    "Topic :: Scientific/Engineering :: Visualization",
]
dependencies = [
    "numpy>=1.20",
    "opencv-python>=4.5",
    "imageio>=2.9",
    "imageio-ffmpeg>=0.4",
    "tifffile>=2021.1",
    "pyyaml>=5.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]
n2v = [
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "tqdm>=4.60.0",
]

[project.scripts]
overlay-render = "overlay_render.cli:main"

[project.urls]
Repository = "https://github.com/RamanLab/overlay_render"

[tool.setuptools.packages.find]
where = ["."]
include = ["overlay_render*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["overlay_render"]
omit = ["overlay_render/tests/*"]
